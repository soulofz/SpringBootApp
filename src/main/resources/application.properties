server.port=8080
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

### Database ###
spring.datasource.url=jdbc:postgresql://localhost:5432/first_database
spring.datasource.username=postgres
spring.datasource.password=root

### Actuator ###
management.endpoints.web.exposure.include=mappings,beans,caches,env,health,metrics,shutdown
management.endpoint.shutdown.access=unrestricted
management.endpoint.env.show-values=always

### File load settings ###
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.max-file-size=10MB

### Swagger ###
### documentation dy default:    /v3/api-docs
### swagger ui dy default:       /swagger-ui/index.html
springdoc.swagger-ui.path=/ui.html
springdoc.api-docs.path=/documentation